    />

    <!--
      Metadatos propios de cada página entre los marcadores seo-head: el
      pre-render (entry-server.tsx) y la función api/render los reemplazan, y
      en el navegador los actualiza usePageMeta. Estos valores por defecto son
      los de la Home; sin canonical ni og:url, que fijos apuntarían todo a la Home.
    -->
    <!--seo-head-->
    <title>Muebles a medida en Buenos Aires | Jasihome Deco</title>
    <meta name="description" content="Fabricamos muebles de álamo y pino: mesas de luz, cómodas, racks de TV y mesas ratonas. 25% OFF en efectivo y envíos a CABA y GBA." />
    <meta property="og:title" content="Muebles a medida en Buenos Aires | Jasihome Deco" />
    <meta property="og:description" content="Fabricamos muebles de álamo y pino: mesas de luz, cómodas, racks de TV y mesas ratonas. 25% OFF en efectivo y envíos a CABA y GBA." />
    <meta property="og:image" content="https://www.jasihomedeco.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!--/seo-head-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jasihome Deco" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FurnitureStore",

        "logo": "https://www.jasihomedeco.com/web-app-manifest-512x512.png",
        "image": "https://www.jasihomedeco.com/og-image.jpg",
        "telephone": "+54 9 11 2405-0288",
        "priceRange": "$$",
        "openingHours": "Mo-Sa 09:00-19:00",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Buenos Aires",
          "addressCountry": "AR"
        },
        "areaServed": ["Ciudad Autónoma de Buenos Aires", "Gran Buenos Aires"],
        "paymentAccepted": "Efectivo, transferencia, tarjeta de crédito",
        "sameAs": [
          "https://www.instagram.com/jasihomedeco/",
          "https://www.facebook.com/profile.php?id=61578282431363"
        ]
      }
    </script>
